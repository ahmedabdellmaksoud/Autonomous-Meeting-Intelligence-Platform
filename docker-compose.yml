version: "3.9"

services:

  ingestion:
    build: ./ingestion_service
    ports:
      - "8000:8000"
    volumes:
      - ./ingestion_service/temp_uploads:/app/temp_uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cognitive:
    build: ./cognitive_service
    ports:
      - "8001:8001"
    volumes:
      - ./ingestion_service/temp_uploads:/app/temp_uploads
      - ./cognitive_service/results:/app/results
    env_file: ./cognitive_service/.env
    depends_on:
      - ingestion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  knowledge:
    build: ./knowledge_service
    ports:
      - "8003:8003"
    volumes:
      - ./knowledge_service/chroma_db:/app/chroma_db
    env_file: ./knowledge_service/.env
    depends_on:
      - cognitive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agentic:
    build: ./agentic_service
    ports:
      - "8002:8002"
    volumes:
      - ./cognitive_service/results:/app/cognitive_results
      - ./agentic_service/results:/app/results
    environment:
      - COGNITIVE_RESULTS_DIR=/app/cognitive_results
    env_file: ./agentic_service/.env
    depends_on:
      - cognitive
      - knowledge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
